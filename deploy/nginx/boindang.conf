# BOINDANG vhost — 공유 프록시(nginx)에 넣는 server 블록.
# BBANGGU 가 이미 호스트 80 을 쓰고 있으므로, 최종적으로는 이 nginx 를 공유 프록시로 돌려
# 두 프로젝트를 server_name(도메인)으로 분기한다. (전환 절차는 deploy/README.md 참고)
#
# 흐름: 브라우저 → https://boindang.duckdns.org → 이 nginx → frontend:3000 / gateway:8000
# same-origin(쿠키 인증) 유지가 핵심: 프론트와 /api 가 같은 오리진이어야 httpOnly 쿠키가 붙는다.
#
# ⚠ 기존 backend/nginx/nginx.conf 와 동일하게 `/api/` → `proxy_pass http://gateway:8000/;`
#   (프록시 패스 URI 에 트레일링 슬래시 → nginx 가 `/api` 프리픽스를 떼고 넘긴다.
#    게이트웨이는 `/user/**` 같은 경로로 받아 StripPrefix=1 로 다시 서비스명 프리픽스를 뗀다.)

# HTTP → HTTPS 리다이렉트 + certbot webroot
server {
    listen 80;
    listen [::]:80;
    server_name boindang.duckdns.org;

    # Let's Encrypt 갱신용 (certbot --webroot -w /var/www/certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name boindang.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/boindang.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boindang.duckdns.org/privkey.pem;
    # certbot certonly(webroot) 는 options-ssl-nginx.conf 를 안 만들므로 직접 지정 (BBANGGU conf 와 동일)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 이미지 업로드(원재료/영양정보 사진) 대응
    client_max_body_size 20m;

    # 게이트웨이 (/api 프리픽스 제거하고 전달)
    location /api/ {
        proxy_pass http://gateway:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # 프론트 (Next.js)
    location / {
        proxy_pass http://frontend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }
}
