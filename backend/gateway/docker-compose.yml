services:
  gateway:
    build:
      context: ./
      dockerfile: Dockerfile
    image: kimhwidong/boindang-repo:gateway
    container_name: gateway
    ports:
      - "8000:8000"
      - "1111:1111"
    environment:
      EUREKA_URL: ${EUREKA_URL}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
    restart: always
    networks:
      - nginx-network
      - redis-network

networks:
  nginx-network:
    external: true
  redis-network:
    external: true