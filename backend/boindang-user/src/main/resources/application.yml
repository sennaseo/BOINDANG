spring:
  application:
    name: boindang-user

  datasource:
    url: ${DB_URL}?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver

  jpa:
    database: mysql
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    p6spy: info   # P6Spy가 찍는 SQL 로그
    org.hibernate.SQL: info  # Hibernate 기본 SQL 로그
    root: INFO
    com.boindanguser: DEBUG  # 애플리케이션 패키지는 DEBUG 레벨
  charset:
    console: UTF-8
    file: UTF-8

eureka:
  client:
    enabled: true
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    hostname: ${HOST_IP}

springdoc:
  swagger-ui:
    path: /user/swagger-ui
  api-docs:
    path: /user/v3/api-docs

server:
  port: 8081
