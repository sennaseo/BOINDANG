# 기본 멀티라인 SQL 로그 포맷 (커스텀 포맷 사용 중이라 비활성)
#logMessageFormat=com.p6spy.engine.spy.appender.MultiLineFormat

# SQL 로그를 SLF4J로 출력
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# 불필요한 SQL 로그 제외 (commit, rollback 등)
filter=true
exclude=commit,rollback,statement_prepare,resultset,debug

# SQL 로그 출력/정렬 커스텀 포맷터 지정
logMessageFormat=com.boindanguser.common.logger.CustomP6SpyLogger
